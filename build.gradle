buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.example.whatsappalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.whatsappalarm"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

tasks.register('generateProjectFiles') {
    doFirst {
        def manifestDir = file("src/main")
        manifestDir.mkdirs()
        file("src/main/AndroidManifest.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <application 
        android:allowBackup="true" 
        android:label="WhatsApp Is Alarmi" 
        android:theme="@style/Theme.AppCompat.Light.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        <service android:name=".NotificationService" android:label="WhatsApp Is Alarmi Servisi" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
            <intent-filter>
                <action android:name="android.service.notification.NotificationListenerService" />
            </intent-filter>
        </service>
    </application>
</manifest>"""

        def kotlinDir = file("src/main/java/com/example/whatsappalarm")
        kotlinDir.mkdirs()

        file("src/main/java/com/example/whatsappalarm/MainActivity.kt").text = """package com.example.whatsappalarm

import android.os.Bundle
import android.widget.TextView
import android.widget.LinearLayout
import android.view.Gravity
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val layout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(64, 64, 64, 64)
        }

        val textView = TextView(this).apply {
            text = "WhatsApp İş Alarmı\\n\\nUygulama Çalışıyor!"
            textSize = 22f
            gravity = Gravity.CENTER
        }

        layout.addView(textView)
        setContentView(layout)
    }
}
"""

        file("src/main/java/com/example/whatsappalarm/NotificationService.kt").text = """package com.example.whatsappalarm

import android.service.notification.NotificationListenerService
import android.service.notification.StatusBarNotification

class NotificationService : NotificationListenerService() {
    override fun onNotificationPosted(sbn: StatusBarNotification?) {
        // Bildirim dinleyici
    }
}
"""
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('generateProjectFiles')
}
