buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.example.whatsappalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.whatsappalarm"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.register('generateProjectFiles') {
    doFirst {
        def manifestDir = file("src/main")
        manifestDir.mkdirs()
        file("src/main/AndroidManifest.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <application android:allowBackup="true" android:label="WhatsApp Is Alarmi" android:theme="@android:style/Theme.Material.Light.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        <service android:name=".NotificationService" android:label="WhatsApp Is Alarmi Servisi" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
            <intent-filter>
                <action android:name="android.service.notification.NotificationListenerService" />
            </intent-filter>
        </service>
    </application>
</manifest>"""

        def kotlinDir = file("src/main/java/com/example/whatsappalarm")
        kotlinDir.mkdirs()
        file("src/main/java/com/example/whatsappalarm/MainActivity.kt").text = """package com.example.whatsappalarm

import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.IntentFilter
import android.os.Bundle
import android.provider.Settings
import android.widget.Button
import android.widget.TextView
import android.widget.LinearLayout
import android.view.Gravity
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    private lateinit var statusTextView: TextView
    private val alarmReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            if (intent?.action == "com.example.whatsappalarm.ALARM_TRIGGERED") {
                statusTextView.text = "ALARM ÇALIYOR!\\nAlanya ve Gazipaşa yakalandı!"
            }
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val layout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(32, 32, 32, 32)
        }

        statusTextView = TextView(this).apply {
            text = "WhatsApp İş Alarmı Aktif\\nBildirim İzni Verin"
            textSize = 20f
            gravity = Gravity.CENTER
        }

        val btnPerm = Button(this).apply {
            text = "Bildirim İzni Ver"
            setOnClickListener {
                startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
            }
        }

        layout.addView(statusTextView)
        layout.addView(btnPerm)
        setContentView(layout)

        val filter = IntentFilter("com.example.whatsappalarm.ALARM_TRIGGERED")
        registerReceiver(alarmReceiver, filter)
    }

    override fun onDestroy() {
        super.onDestroy()
        unregisterReceiver(alarmReceiver)
    }
}
"""
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('generateProjectFiles')
}

