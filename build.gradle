buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
            classpath 'com.android.tools.build:gradle:8.2.2'


    }
}
plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.example.whatsappalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.whatsappalarm"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

// BULUTTA DİĞER TÜM DOSYALARI OTOMATİK OLUŞTURAN SİHİRLİ AYAR
tasks.register('generateProjectFiles') {
    doFirst {
        // 1. AndroidManifest.xml Oluşturma
        def manifestDir = file("src/main")
        manifestDir.mkdirs()
        file("src/main/AndroidManifest.xml").text = """<?xml version='1.0' encoding='utf-8'?>
<manifest xmlns:android='http://android.com' package='com.example.whatsappalarm'>
    <uses-permission android:name='android.permission.MODIFY_AUDIO_SETTINGS' />
    <application android:allowBackup='true' android:label='WhatsApp İş Alarmı' android:theme='@android:style/Theme.Material.NoActionBar'>
        <activity android:name='.MainActivity' android:exported='true'>
            <intent-filter>
                <action android:name='android.intent.action.MAIN' />
                <category android:name='android.intent.category.LAUNCHER' />
            </intent-filter>
        </activity>
        <service android:name='.NotificationService' android:label='WhatsApp İş Alarmı Servisi' android:permission='android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' android:exported='true'>
            <intent-filter>
                <action android:name='android.service.notification.NotificationListenerService' />
            </intent-filter>
        </service>
    </application>
</manifest>"""

        // 2. MainActivity.kt Oluşturma
        def kotlinDir = file("src/main/java/com/example/whatsappalarm")
        kotlinDir.mkdirs()
        file("src/main/java/com/example/whatsappalarm/MainActivity.kt").text = """package com.example.whatsappalarm
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.IntentFilter
import android.os.Bundle
import android.provider.Settings
import android.widget.Button
import android.widget.TextView
import android.widget.LinearLayout
import android.view.Gravity
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    private lateinit var statusTextView: TextView
    private val alarmReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            if (intent?.action == "com.example.whatsappalarm.ALARM_TRIGGERED") {
                statusTextView.text = "ALARM ÇALIYOR!\\nAlanya ve Gazipaşa yakalandı!"
            }
        }
    }
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val layout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(50, 50, 50, 50)
        }
        statusTextView = TextView(this).apply {
            text = "Sistem Beklemede...\\nBildirim iznini vermeyi unutmayın."
            textSize = 20f
            gravity = Gravity.CENTER
        }
        val permissionButton = Button(this).apply {
            text = "Bildirim Erişimini Aç"
            setOnClickListener { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }
        }
        val stopButton = Button(this).apply {
            text = "Alarmı Durdur"
            setOnClickListener {
                startService(Intent(this@MainActivity, NotificationService::class.java).apply { action = "STOP_ALARM" })
                statusTextView.text = "Alarm Susturuldu.\\nSistem yeniden dinlemede."
            }
        }
        layout.addView(statusTextView)
        layout.addView(permissionButton)
        layout.addView(stopButton)
        setContentView(layout)
        registerReceiver(alarmReceiver, IntentFilter("com.example.whatsappalarm.ALARM_TRIGGERED"), RECEIVER_EXPORTED)
    }
    override fun onDestroy() {
        super.onDestroy()
        unregisterReceiver(alarmReceiver)
    }
}"""

        // 3. NotificationService.kt Oluşturma
        file("src/main/java/com/example/whatsappalarm/NotificationService.kt").text = """package com.example.whatsappalarm
import android.content.Context
import android.content.Intent
import android.media.AudioAttributes
import android.media.AudioManager
import android.media.Ringtone
import android.media.RingtoneManager
import android.os.Build
import android.service.notification.NotificationListenerService
import android.service.notification.StatusBarNotification
import java.util.Locale

class NotificationService : NotificationListenerService() {
    private var ringtone: Ringtone? = null
    private var lastTriggerTime: Long = 0
    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        if (intent?.action == "STOP_ALARM") { stopAlarm() }
        return START_STICKY
    }
    override fun onNotificationPosted(sbn: StatusBarNotification?) {
        if (sbn == null) return
        if (sbn.packageName == "com.whatsapp.w4b") {
            val extras = sbn.notification.extras
            val title = extras.getString("android.title")?.lowercase(Locale.ROOT) ?: ""
            val text = extras.getCharSequence("android.text")?.toString()?.lowercase(Locale.ROOT) ?: ""
            val fullMessage = "\$title \$text"
            if (fullMessage.contains("alanya") && (fullMessage.contains("gazipaşa") || fullMessage.contains("gazipasa"))) {
                val currentTime = System.currentTimeMillis()
                if (currentTime - lastTriggerTime > 10000) {
                    lastTriggerTime = currentTime
                    triggerAlarm()
                }
            }
        }
    }
    private fun triggerAlarm() {
        try {
            val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
            val maxMedia = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
            audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxMedia, 0)
            val maxAlarm = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM)
            audioManager.setStreamVolume(AudioManager.STREAM_ALARM, maxAlarm, 0)
            if (ringtone == null || !ringtone!!.isPlaying) {
                val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM) ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                ringtone = RingtoneManager.getRingtone(applicationContext, alarmUri)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                    ringtone?.audioAttributes = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
                }
                ringtone?.play()
                sendBroadcast(Intent("com.example.whatsappalarm.ALARM_TRIGGERED"))
            }
        } catch (e: Exception) { e.printStackTrace() }
    }
    private fun stopAlarm() { if (ringtone != null && ringtone!!.isPlaying) { ringtone?.stop() } }
    override fun onNotificationRemoved(sbn: StatusBarNotification?) {}
}"""
    }
}

preBuild.dependsOn generateProjectFiles
